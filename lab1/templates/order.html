<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ .order.Title }}</title>
  <link rel="stylesheet" href="/resources/order_style.css">
  <link rel="stylesheet" href="/resources/index_style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
  <a class="logo-icon" href="/stages" aria-label="На главную">
        <img class="logo-img" src="/header_icon.png" alt="На главную" width="40" height="40" />
      </a>
      <div class="site-title">Классификатор АГ</div>
    </div>
  </header>

  <main class="container order-wrap">
    <div class="order-card">
      <div class="order-left">
        {{ if .order.ImageKey }}
        <img src="{{ minioURL .order.ImageKey }}" alt="{{ .order.Title }}" style="max-width:100%;max-height:100%;object-fit:contain;display:block"/>
        {{ else }}
        <div class="order-icon">{{ .order.Icon }}</div>
        {{ end }}
      </div>
      <div class="order-right">
        <h1 class="order-title">{{ .order.Title }}</h1>
        <p class="order-meta"><strong>Давление:</strong> {{ .order.Pressure }}</p>
        <p class="order-meta">Риск: <span class="risk {{ .order.RiskClass }}">{{ .order.RiskName }}</span></p>
        <p class="order-meta">Код: <a class="code-link" href="#">{{ .order.Code }}</a></p>
      </div>
    </div>

    <section class="order-desc">
      <h2>Описание</h2>
      <p>{{ .order.Description }}</p>
    </section>
  </main>
</body>
</html>
