<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Классификатор АГ</title>
        <link rel="stylesheet" href="/resources/index_style.css">
    </head>
    <body>
        <header class="site-header">
            <div class="container header-inner">
                <a class="logo-icon" href="/stages" aria-label="На главную">
                    <img class="logo-img" src="/header_icon.png" alt="На главную" width="40" height="40" />
                </a>
                <div class="site-title">Классификатор АГ</div>
            </div>
        </header>

        <div class="container actions">
            <form class="search" action="/stages" method="GET">
                <input class="search-input" type="text" name="stage" placeholder="Найти по стадиям" value="{{ .query }}">
                <button class="search-btn" type="submit">Найти</button>
            </form>
            <a class="my-app" href="/request/1">📁 Моя заявка ({{ .appCount }})</a>
        </div>

        <main class="container">
            <section class="cards-grid">
                {{ range .orders }}
                <article class="card">
                    <div class="card-top">
                        {{ if .ImageKey }}
                        <img src="{{ minioURL .ImageKey }}" alt="{{ .Title }}" style="max-width:100%;max-height:100%;object-fit:contain;display:block"/>
                        {{ else }}
                        <div class="card-icon">{{ .Icon }}</div>
                        {{ end }}
                    </div>
                    <div class="card-body">
                        <h3 class="card-title"><span class="risk {{ .RiskClass }}" style="font:inherit;">{{ .Title }}</span></h3>
                        <p class="meta"><span>Давление:</span> {{ .Pressure }}</p>
                        <p class="meta">Риск: <span class="risk {{ .RiskClass }}">{{ .RiskName }}</span></p>
                        <p class="meta">Код: <a class="code-link" href="#">{{ .Code }}</a></p>
                        <div class="card-actions">
                            <a class="btn" href="/stage/{{ .ID }}">Подробнее</a>
                        </div>
                    </div>
                </article>
                {{ end }}
            </section>
        </main>
    </body>
</html>
