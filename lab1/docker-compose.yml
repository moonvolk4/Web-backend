version: "4.46"

services:
  minio:
    image: minio/minio:latest
    container_name: lab1-minio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:latest
    container_name: lab1-minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
       mc mb -p local/${MINIO_BUCKET} || true &&
       mc anonymous set download local/${MINIO_BUCKET} || true &&
       echo 'MinIO bucket ${MINIO_BUCKET} ready'"
    restart: "no"

  nginx:
    image: nginx:alpine
    container_name: lab1-nginx
    depends_on:
      - minio
    ports:
      - "${NGINX_PORT}:8080" # Меняйте NGINX_PORT в .env, если 8080 занят
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  minio-data:
    name: lab1-minio-data
