server {
  listen 8080;
  server_name _;

  # Optional: simple health endpoint
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok\n';
  }

  # Proxy /images/<object> to MinIO public bucket "images"
  # Example: http://localhost:8080/images/foo.jpg -> http://minio:9000/images/foo.jpg
  location /images/ {
    # Важно: не используем переменные окружения внутри пути proxy_pass.
    # Жёстко проксируем на бакет "images" в MinIO.
    proxy_pass http://minio:9000/images/;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering on;
    proxy_cache_bypass $http_cache_control $http_pragma;
    add_header Cache-Control "public, max-age=86400";
  }
}
