<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ошибка</title>
  <link rel="stylesheet" href="/resources/index_style.css">
  <link rel="stylesheet" href="/resources/order_style.css">
  <style>
    .error-wrap { max-width:720px;margin:40px auto;padding:24px;border:1px solid #ddd;border-radius:12px;background:#fff; }
  </style>
  </head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo-icon" href="/stages" aria-label="На главную">
        <img class="logo-img" src="/header_icon.png" alt="На главную" width="40" height="40" />
      </a>
      <div class="site-title">Классификатор АГ</div>
    </div>
  </header>

  <main class="container">
    <div class="error-wrap">
      <h2>Произошла ошибка</h2>
      {{ if eq .code "not_found" }}
        <p>Заявка не найдена или была удалена.</p>
      {{ else if eq .code "bad_request" }}
        <p>Некорректный запрос.</p>
      {{ else }}
        <p>Что-то пошло не так.</p>
      {{ end }}
    </div>
  </main>
</body>
</html>
